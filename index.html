<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A classic snake game built with vanilla HTML, CSS and JavaScript." />
  <title>Snake</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="frame">
    <header class="stats" aria-label="Game statistics">
      <div class="stat">High Score : <span id="high-score">0</span></div>
      <div class="stat">Score : <span id="score">0</span></div>
      <div class="stat">time : <span id="timer">00-00</span></div>
    </header>

    <section class="board" id="board" aria-label="Game board">
      <canvas id="game" aria-label="Snake game canvas"></canvas>
      <canvas id="wave" aria-hidden="true"></canvas>

      <div class="overlay" id="overlay" role="status" aria-live="polite">
        <h1 class="overlay__title" id="overlay-title">Snake</h1>
        <p class="overlay__text" id="overlay-text">Use arrow keys or WASD to move.</p>
        <ol class="overlay__history" id="overlay-history" hidden></ol>
        <button class="btn" id="action-btn" type="button">Start</button>
        <p class="overlay__hint">Space: start / pause &nbsp;·&nbsp; Swipe on touch devices</p>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
